server {
    listen 80;
    listen [::]:80;
    server_name pasule.com www.pasule.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pasule.com;
        try_files $uri =404;
    }

    location / {
        return 301 https://pasule.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pasule.com;

    ssl_certificate /etc/letsencrypt/live/pasule.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pasule.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pasule.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pasule.com;

    ssl_certificate /etc/letsencrypt/live/pasule.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pasule.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /www/wwwroot/pasule.com/current;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pasule.com;
        try_files $uri =404;
    }

    location ^~ /api/twikoo/ {
        proxy_pass http://127.0.0.1:18090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_cache off;
        client_max_body_size 16m;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /_astro/ {
        alias /www/wwwroot/pasule.com/shared/_astro/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
        add_header Cache-Control "public, max-age=600";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /404.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    access_log /www/wwwlogs/pasule.com.log;
    error_log /www/wwwlogs/pasule.com.error.log;
}
